name: persimmon-app-prod

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Specify the branch to run the workflow'
        required: true

env:
  PROJECT_ID: persimmon-ai
  REGION: us-west1
  REPO_NAME: persimmon-app

#   NEXT_PUBLIC_API_URL: https://persimmon-api-stage-793571778940.us-west1.run.app/api/v1/resumes/process
#   NEXT_PUBLIC_API_URL_CREATE_PASSWORD: https://persimmon-app-satge-793571778940.asia-south1.run.app/auth/create-password
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAGBjx8pRgDaSRbWMHwH0y3Bfa6grShctU
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: persimmon-83a56.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: persimmon-83a56
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: persimmon-83a56.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 14382778969
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:14382778969:web:ab033363598c1d5031bf48
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-M91WKC007R
  NEXT_PUBLIC_API: https://persimmon-api-793571778940.us-west1.run.app/
  NEXT_PUBLIC_FE_URL: https://persimmon.tekworks.ai
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6LcKY-sqAAAAAOAtcgSczb82KI9ovhNmaWgJ6u5E
  NEXT_PUBLIC_OTPLESS_KEY: MK8LY03OLCSDOMO0QCQP
  NEXT_PUBLIC_TINYMCE_API_KEY: 88ueaj3cjommfgvstkn3pyasmw8cky99u4ba7uj89gratoiq
  NEXT_PUBLIC_REDIRECT_URL: https://persimmon.tekworks.ai/integrations/zoom-integrations
  NEXT_PUBLIC_EMAIL_SERVICE_ACCOUNT: careers@tekworks.ai
#   NEXT_PUBLIC_MANAGE_PASSWORD_UI: https://persimmon-app-satge-793571778940.asia-south1.run.app/auth/manage-password

jobs:
  build-and-deploy:
    name: Setup, Build, and Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Authenticate with Google Cloud
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"

      # Setup gcloud CLI/SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker
          
      - name: Build and tag the docker image
        run: |-
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID} \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID} \
            --build-arg NEXT_PUBLIC_API=${NEXT_PUBLIC_API} \
            --build-arg NEXT_PUBLIC_FE_URL=${NEXT_PUBLIC_FE_URL} \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY} \
            --build-arg NEXT_PUBLIC_OTPLESS_KEY=${NEXT_PUBLIC_OTPLESS_KEY} \
            --build-arg NEXT_PUBLIC_TINYMCE_API_KEY=${NEXT_PUBLIC_TINYMCE_API_KEY} \
            --build-arg NEXT_PUBLIC_REDIRECT_URL=${NEXT_PUBLIC_REDIRECT_URL} \
            --build-arg NEXT_PUBLIC_EMAIL_SERVICE_ACCOUNT=${NEXT_PUBLIC_EMAIL_SERVICE_ACCOUNT} \
            --tag gcr.io/$PROJECT_ID/$REPO_NAME:$GITHUB_SHA .
      - name: Push the image to the Google Container Registry (GCR)
        run: |-
          docker push gcr.io/$PROJECT_ID/$REPO_NAME:$GITHUB_SHA
      - name: Deploy
        run: |-
          gcloud run deploy $REPO_NAME \
          --region $REGION \
          --image gcr.io/$PROJECT_ID/$REPO_NAME:$GITHUB_SHA \
          --platform "managed" \
          --allow-unauthenticated \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }} \
        #   --set-env-vars NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }} \
        #   --set-env-vars NEXT_PUBLIC_API_URL_CREATE_PASSWORD=${{ secrets.NEXT_PUBLIC_API_URL_CREATE_PASSWORD }} \
        #   --set-env-vars NEXT_PUBLIC_API=${{ secrets.API_URL_DEV }}
